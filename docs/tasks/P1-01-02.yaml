requirements:
  - docker-compose 包含服务: postgres (带 TimescaleDB 扩展), redis, minio, emqx, backend
  - postgres 初始化脚本创建数据库 iot_platform 并启用 timescaledb 扩展
  - minio 预创建 bucket: iot-images, iot-firmware
  - emqx 启用 HTTP Auth 与 ACL，回调地址指向 backend:8000
  - 所有服务有 healthcheck
  - 所有端口暴露到宿主机（开发方便），backend depends_on 其他服务 healthy
  - 使用 .env 文件读取密码等配置

