  - middleware.py 从 Header "X-Tenant-Id" 提取，忽略 /health /docs /openapi.json
  - filters.py 监听 SQLAlchemy "do_orm_execute" 事件，自动为 TenantModel 子类查询追加 WHERE tenant_id = :tid
  - decorators.py 提供 @tenant_ignore 装饰器，临时禁用过滤
  - deps.py 提供 get_tenant_id() FastAPI 依赖
  - 单元测试：验证 ContextVar 隔离（不同协程互不污染）
  - 集成测试：
    - 创建 A/B 两个租户的数据
    - 设置 context=A 时查询只返回 A 的数据
    - 使用 @tenant_ignore 时返回全部数据
    - tenant_id 为 None 时查询 TenantModel 应抛出 TenantRequiredError

