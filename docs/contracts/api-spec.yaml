  # ---------- Appointment ----------
  /appointment/bookings:
    get:  { tags: [appointment], summary: 预约列表 }
    post: { tags: [appointment], summary: 创建预约 }
  /appointment/bookings/{id}:
    get:    { tags: [appointment], summary: 预约详情 }
    delete: { tags: [appointment], summary: 取消预约 }
  /appointment/bookings/{id}/qrcode:
    get: { tags: [appointment], summary: 获取预约二维码 }
  /appointment/scan/{token}:
    post: { tags: [appointment], summary: 扫码核销, security: [] }

  # ---------- Dispatch ----------
  /dispatch/vehicles:
    get:  { tags: [dispatch], summary: 车辆列表 }
    post: { tags: [dispatch], summary: 注册车辆 }
  /dispatch/drivers:
    get: { tags: [dispatch], summary: 司机列表 }
  /dispatch/orders:
    get:  { tags: [dispatch], summary: 调度单列表 }
    post: { tags: [dispatch], summary: 创建调度单 }
  /dispatch/orders/{id}/assign:
    post: { tags: [dispatch], summary: 派车 }
  /dispatch/orders/{id}/track:
    get: { tags: [dispatch], summary: 实时轨迹 }

  # ---------- Infra ----------
  /infra/health:
    get: { tags: [infra], summary: 健康检查, security: [] }
  /infra/version:
    get: { tags: [infra], summary: 版本信息, security: [] }
  /infra/file/upload:
    post: { tags: [infra], summary: 通用文件上传 }
  /infra/file/{key}:
    get: { tags: [infra], summary: 文件下载 }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - bearerAuth: []
