# 统一错误码定义
# 格式: <错误码>: { message: 默认消息, http_status: HTTP 状态码 }
# 错误码分段:
#   0xxxx: 通用 (success/auth/permission/validation/...)
#   1xxxx: 租户 (tenant)
#   2xxxx: 设备 (device)
#   3xxxx: 地磅 (weighbridge)
#   4xxxx: 预约 (appointment)
#   5xxxx: 调度 (dispatch)
#   6xxxx: 时序/告警 (telemetry/alarm)
#   7xxxx: 图像/CVAT (image)
#   8xxxx: 边缘端 (edge)
#   9xxxx: 系统内部错误

# ============ 通用 0xxxx ============
SUCCESS:
  code: 0
  message: 成功
  http_status: 200

UNAUTHORIZED:
  code: 10001
  message: 未登录或登录已过期
  http_status: 401

INVALID_TOKEN:
  code: 10002
  message: 无效的访问令牌
  http_status: 401

TOKEN_EXPIRED:
  code: 10003
  message: 访问令牌已过期
  http_status: 401

REFRESH_TOKEN_INVALID:
  code: 10004
  message: 刷新令牌无效或已过期
  http_status: 401

FORBIDDEN:
  code: 10101
  message: 无权限访问
  http_status: 403

DATA_PERMISSION_DENIED:
  code: 10102
  message: 无数据权限
  http_status: 403

NOT_FOUND:
  code: 10201
  message: 资源不存在
  http_status: 404

VALIDATION_ERROR:
  code: 10301
  message: 参数校验失败
  http_status: 422

DUPLICATE_RESOURCE:
  code: 10302
  message: 资源已存在
  http_status: 409

RATE_LIMITED:
  code: 10401
  message: 请求过于频繁
  http_status: 429

INTERNAL_ERROR:
  code: 10501
  message: 服务器内部错误
  http_status: 500

